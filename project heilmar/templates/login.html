<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cafe Admin Login</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    font-family: Arial;

    background:
    radial-gradient(
        circle at top,
        #30260e,
        #080808 55%
    );

    color: white;

}


.login-box {

    width: 380px;

    padding: 40px;

    background: rgba(20,20,20,.95);

    border: 1px solid #3b331d;

    border-radius: 25px;

    box-shadow:
    0 30px 80px rgba(0,0,0,.6);

}


.logo {

    text-align: center;

    color: #d4af37;

    font-size: 28px;

    font-weight: bold;

    margin-bottom: 10px;

}


.subtitle {

    text-align: center;

    color: #888;

    margin-bottom: 30px;

}


label {

    display: block;

    color: #aaa;

    font-size: 13px;

    margin-bottom: 8px;

}


input {

    width: 100%;

    padding: 14px;

    margin-bottom: 20px;

    background: #101010;

    border: 1px solid #333;

    border-radius: 10px;

    color: white;

    outline: none;

}


input:focus {

    border-color: #d4af37;

}


button {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 10px;

    background: #d4af37;

    color: #000;

    font-weight: bold;

    cursor: pointer;

}


button:hover {

    background: #f0d66b;

}


.error {

    background: #3b1515;

    color: #ff8585;

    padding: 12px;

    border-radius: 8px;

    margin-bottom: 20px;

    text-align: center;

}


.back {

    display: block;

    text-align: center;

    margin-top: 25px;

    color: #888;

    text-decoration: none;

}


</style>

</head>


<body>


<div class="login-box">


    <div class="logo">
        CAFE ADMIN
    </div>


    <div class="subtitle">
        Secure Dashboard Login
    </div>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form
        method="POST"
        action="/login">


        <label>
            Username
        </label>


        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required>


        <label>
            Password
        </label>


        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required>


        <button type="submit">
            LOGIN TO DASHBOARD
        </button>


    </form>


    <a
        href="/"
        class="back">
        ← Back to Website
    </a>


</div>


</body>

</html>
